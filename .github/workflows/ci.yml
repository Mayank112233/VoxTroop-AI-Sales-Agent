name: Validate VoxTroop and Academy

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: voxtroop
    env:
      MOCK_AI_MODE: "true"
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: voxtroop/requirements.lock.txt
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m pytest -q

  frontends:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            voxtroop/frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm ci
        working-directory: voxtroop/frontend
      - run: npm run build
        working-directory: voxtroop/frontend
